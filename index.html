<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiniPrint Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 space-y-6">
    <header class="text-center">
      <h1 class="text-2xl font-semibold text-gray-800">📄 MiniPrint</h1>
      <p class="text-gray-500 text-sm mt-1">Upload a PDF to print via your local CUPS queue</p>
    </header>

    <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-4">
      <label class="block">
        <span class="block text-sm font-medium text-gray-700 mb-1">Select PDF</span>
        <input
          type="file"
          name="file"
          accept="application/pdf"
          required
          class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </label>

      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="block text-sm font-medium text-gray-700 mb-1">Color Mode</span>
          <select name="color" class="w-full border border-gray-300 rounded-lg text-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="Color">Color</option>
            <option value="Gray">Black &amp; White</option>
          </select>
        </label>

        <label class="block">
          <span class="block text-sm font-medium text-gray-700 mb-1">Duplex</span>
          <select name="duplex" class="w-full border border-gray-300 rounded-lg text-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="DuplexNoTumble">Two-Sided</option>
            <option value="None">Single-Sided</option>
          </select>
        </label>
      </div>

      <button
        type="submit"
        class="w-full py-2 px-4 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm transition"
      >
        Upload & Print
      </button>
    </form>

    <div class="flex items-center justify-between text-sm pt-2">
      <a href="/status" class="text-blue-600 hover:underline">View Status →</a>
      <span class="text-gray-400">Tailscale-only · No auth</span>
    </div>
  </div>
</body>
</html>

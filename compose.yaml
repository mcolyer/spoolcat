services:
  spoolcat:
    image: ghcr.io/mcolyer/spoolcat:latest
    volumes:
      - data:/data
      - spool:/spool
    environment:
      PRINTER: "ipp://10.0.1.183/ipp/print"
      HOST: "0.0.0.0"
      PORT: "80"
      DB_PATH: "/data/jobs.sqlite3"
      UPLOAD_DIR: "/spool"
      RETENTION_DAYS: "7"
      MAX_UPLOAD_MB: "64"
    x-ports:
      - spoolcat.uncloud.lan:80/http
    deploy:
      restart_policy:
        condition: any

volumes:
  data:
  spool:
